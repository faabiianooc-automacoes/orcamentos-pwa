    /* Se os arquivos do app não carregaram (ex.: index.html aberto direto do

      document.body.innerHTML = '<div style="font:16px/1.5 system-ui,sans-serif;max-width:520px;margin:0 auto;padding:24px;color:#142029;background:#fff">' +

        '<p>Publique a pasta no GitHub Pages ou no Netlify (veja o README) e abra o endereço https no navegador. Depois, use "Adicionar à tela inicial".</p></div>';
    }
